name: Payment webhook tests

on:
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/components/PaymentMethodChoice.tsx"
      - "src/components/PaymentResultPage.tsx"
      - "src/components/CompanySubscriptionsPage.tsx"
      - "src/components/AdvertisingPlansPage.tsx"
      - "src/components/ManagedSourcingPage.tsx"
      - "src/components/WorkspacePage.tsx"
      - "src/components/AdminReviewPage.tsx"
      - "supabase/migrations/*sync_paid_service_review*.sql"
      - "supabase/functions/_shared/payment-signatures.ts"
      - "supabase/functions/_shared/payment-signatures.test.ts"
      - "supabase/functions/_shared/payment-webhook.ts"
      - "supabase/functions/_shared/payment-webhook.test.ts"
      - "supabase/functions/payments-webhook/**"
      - "supabase/functions/create-payment-intent/**"
      - "supabase/functions/_shared/payment-intent.ts"
      - "supabase/functions/_shared/payment-intent.test.ts"
      - "supabase/migrations/*payment_intent*.sql"
      - "supabase/migrations/*payment_webhook*.sql"
      - ".github/workflows/payment-signature-tests.yml"
  push:
    branches:
      - "feat/unified-payment-center"
    paths:
      - "src/App.tsx"
      - "src/components/PaymentMethodChoice.tsx"
      - "src/components/PaymentResultPage.tsx"
      - "src/components/CompanySubscriptionsPage.tsx"
      - "src/components/AdvertisingPlansPage.tsx"
      - "src/components/ManagedSourcingPage.tsx"
      - "src/components/WorkspacePage.tsx"
      - "src/components/AdminReviewPage.tsx"
      - "supabase/migrations/*sync_paid_service_review*.sql"
      - "supabase/functions/_shared/payment-signatures.ts"
      - "supabase/functions/_shared/payment-signatures.test.ts"
      - "supabase/functions/_shared/payment-webhook.ts"
      - "supabase/functions/_shared/payment-webhook.test.ts"
      - "supabase/functions/payments-webhook/**"
      - "supabase/functions/create-payment-intent/**"
      - "supabase/functions/_shared/payment-intent.ts"
      - "supabase/functions/_shared/payment-intent.test.ts"
      - "supabase/migrations/*payment_intent*.sql"
      - "supabase/migrations/*payment_webhook*.sql"
      - ".github/workflows/payment-signature-tests.yml"

permissions:
  contents: read

jobs:
  verify-payment-webhooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check payment webhook endpoint
        run: deno check --node-modules-dir=auto supabase/functions/payments-webhook/index.ts supabase/functions/create-payment-intent/index.ts
      - name: Run payment signature and webhook normalization tests
        run: deno test supabase/functions/_shared/payment-signatures.test.ts supabase/functions/_shared/payment-webhook.test.ts supabase/functions/_shared/payment-intent.test.ts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Build My Car frontend
        run: npm run build
