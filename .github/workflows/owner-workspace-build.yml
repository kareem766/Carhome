name: Owner workspace build check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/WorkspacePage.tsx'
      - 'src/components/VehicleCatalogPage.tsx'
      - 'src/App.tsx'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/owner-workspace-build.yml'
  push:
    branches: [feat/owner-workspace-management]

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
