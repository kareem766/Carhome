<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142D4E" />
    <meta name="description" content="My Car — منصة تربط ملاك السيارات وموردي الأساطيل بالشركات الباحثة عن تأجير طويل الأجل في مصر." />
    <link rel="icon" type="image/svg+xml" href="/carhome-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>My Car | منصة السيارات للشركات والأساطيل في مصر</title>
  </head>
  <body>
    <div id="root">
      <main dir="rtl" aria-label="جارٍ تحميل منصة My Car" style="min-height:100vh;display:grid;place-items:center;background:#f8fafc;font-family:Arial,sans-serif;color:#1e293b">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
          <div style="width:96px;height:96px;position:relative;display:grid;place-items:center">
            <span aria-hidden="true" style="position:absolute;inset:0;border:4px solid #ffedd5;border-top-color:#f97316;border-radius:50%;animation:mycar-spin 1.4s linear infinite"></span>
            <strong style="font-size:22px;font-weight:900;letter-spacing:-1px;white-space:nowrap"><span style="color:#1d4ed8">My</span><span style="color:#f97316"> Car</span></strong>
          </div>
          <span style="font-size:12px;font-weight:600;color:#64748b">جارٍ تحميل الصفحة...</span>
        </div>
      </main>
      <style>@keyframes mycar-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#root span[aria-hidden="true"]{animation:none!important}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
