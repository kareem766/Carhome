<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142D4E" />
    <meta name="description" content="My Car — منصة تربط ملاك السيارات وموردي الأساطيل بالشركات الباحثة عن تأجير طويل الأجل في مصر." />
    <link rel="icon" type="image/svg+xml" href="/carhome-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>My Car | منصة السيارات للشركات والأساطيل في مصر</title>
  </head>
  <body>
    <div id="root">
      <main dir="rtl" aria-label="جارٍ تحميل منصة My Car" style="min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#09275b 0%,#061a40 58%,#03112d 100%);font-family:Arial,sans-serif;color:#fff">
        <div style="display:flex;flex-direction:column;align-items:center;gap:20px">
          <div style="width:176px;height:176px;position:relative;display:grid;place-items:center">
            <span style="position:absolute;inset:0;border:3px solid transparent;border-top-color:#28c8ff;border-right-color:#1677f8;border-radius:50%;animation:mycar-spin 2.4s linear infinite"></span>
            <svg viewBox="0 0 160 160" width="128" height="128" role="img" aria-label="رمز تحميل My Car">
              <defs><linearGradient id="carBody" x1="35" y1="50" x2="126" y2="115" gradientUnits="userSpaceOnUse"><stop stop-color="#f8fcff"/><stop offset=".55" stop-color="#62caff"/><stop offset="1" stop-color="#1683e9"/></linearGradient></defs>
              <path d="M25 91 34 66Q38 55 51 53l13-2 13-17q4-5 11-5h15q7 0 11 5l13 17 13 2q13 2 17 13l9 25v24H25z" fill="#0a2b60" stroke="url(#carBody)" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="m57 54 12-16q3-4 8-4h18q5 0 8 4l12 16z" fill="#071a3c" stroke="#d9f4ff" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="m34 78 26 4 12 13-43-3zM126 82l26-4 5 14-43 3z" fill="#dff8ff" stroke="#38c5ff" stroke-width="2" stroke-linejoin="round"/>
              <path d="M68 101h24" stroke="#bdeeff" stroke-width="3" stroke-linecap="round"/>
              <path d="M53 113h54" stroke="#1683e9" stroke-width="3" stroke-linecap="round"/>
              <rect x="34" y="105" width="18" height="24" rx="8" fill="#061735" stroke="#42bfff" stroke-width="3"/>
              <rect x="118" y="105" width="18" height="24" rx="8" fill="#061735" stroke="#42bfff" stroke-width="3"/>
              <path d="M20 139h120" stroke="#f5a623" stroke-width="3" stroke-linecap="round" opacity=".9"/>
            </svg>
          </div>         <strong style="font-size:16px;font-weight:700">جارٍ تحميل الصفحة...</strong>
          <span style="width:192px;max-width:70vw;height:6px;border:1px solid rgba(147,197,253,.4);border-radius:99px;background:rgba(8,30,70,.8);overflow:hidden"><span style="display:block;width:60%;height:100%;border-radius:99px;background:linear-gradient(90deg,#16b9ff,#1689ff,#fff);box-shadow:0 0 14px #159dff;animation:mycar-pulse 1.15s ease-in-out infinite alternate"></span></span>
          <span style="font-size:10px;font-weight:700;letter-spacing:.24em;color:rgba(219,234,254,.7)">MY CAR</span>
        </div>
      </main>
      <style>
        @keyframes mycar-spin{to{transform:rotate(360deg)}}
        @keyframes mycar-pulse{from{opacity:.55;transform:translateX(-18%)}to{opacity:1;transform:translateX(28%)}}
        @media(prefers-reduced-motion:reduce){#root span{animation:none!important}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
