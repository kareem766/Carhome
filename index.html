<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142D4E" />
    <meta name="description" content="My Car — منصة تربط ملاك السيارات وموردي الأساطيل بالشركات الباحثة عن تأجير طويل الأجل في مصر." />
    <link rel="icon" type="image/svg+xml" href="/carhome-icon.svg?v=20261031-2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>My Car | منصة السيارات للشركات والأساطيل في مصر</title>
  </head>
  <body>
    <div id="root">
      <main dir="rtl" aria-label="جارٍ تحميل منصة My Car" style="min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,rgba(32,190,220,.12),transparent 48%),#f4f7fc;font-family:Arial,sans-serif;color:#173653">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
          <div style="width:128px;height:128px;position:relative;display:grid;place-items:center">
            <span style="position:absolute;inset:0;border:3px solid #dce8f4;border-top-color:#f5a623;border-left-color:#23c5df;border-radius:50%;animation:mycar-spin 1.15s linear infinite"></span>
            <span style="width:96px;height:96px;display:grid;place-items:center;border-radius:28px;border:1px solid white;background:linear-gradient(135deg,#173c61,#0b2039);box-shadow:0 12px 30px rgba(12,38,67,.25)">
              <svg viewBox="0 0 96 96" width="82" height="82" role="img" aria-label="My Car">
                <path d="M17 53.5 23.5 37c1.8-4.5 5.3-7 10.2-7h28.6c4.8 0 8.3 2.4 10.2 7L79 53.5v17H17z" fill="#f5a623"/>
                <path d="m29 39-4.5 11h47L67 39c-.8-2-2.2-3-5-3H34c-2.8 0-4.2 1-5 3Z" fill="#eaf7ff"/>
                <path d="M12 59h72" stroke="#23c5df" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="31" cy="70" r="7" fill="#eaf7ff" stroke="#23c5df" stroke-width="2"/>
                <circle cx="65" cy="70" r="7" fill="#eaf7ff" stroke="#23c5df" stroke-width="2"/>
                <path d="M31 17h34" stroke="#23c5df" stroke-width="4" stroke-linecap="round"/>
                <path d="M36 24h24" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </span>
          </div>
          <strong style="font-size:14px;letter-spacing:.04em">جارٍ تجهيز تجربتك على My Car...</strong>
          <span style="width:128px;height:4px;border-radius:99px;background:#dce8f4;overflow:hidden"><span style="display:block;width:50%;height:100%;background:linear-gradient(90deg,#f5a623,#23c5df);animation:mycar-pulse 1s ease-in-out infinite alternate"></span></span>
        </div>
      </main>
      <style>
        @keyframes mycar-spin{to{transform:rotate(360deg)}}
        @keyframes mycar-pulse{from{opacity:.45;transform:translateX(-35%)}to{opacity:1;transform:translateX(100%)}}
        @media(prefers-reduced-motion:reduce){#root span{animation:none!important}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
